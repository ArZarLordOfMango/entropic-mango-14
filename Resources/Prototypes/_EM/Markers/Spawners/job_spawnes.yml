- type: entity
  id: EMJobBaseSpawnPoint
  parent: EMMarkerBase
  categories: [ForkFiltered]
  abstract: true
  suffix: Job Spawn
  components:
    - type: SpawnPoint
      spawn_type: Job
    - type: Sprite
      layers:
        - sprite: _EM/Markers/spawners.rsi
        - state: square-spawner
          color: "#55ff00"
        - sprite: &icon-rsi _EM/Interface/Misc/job_icon.rsi
          scale: 2.0,2.0
          state: Base

