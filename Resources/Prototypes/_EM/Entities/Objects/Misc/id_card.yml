- type: entity
  parent: EMBaseClothing
  id: EMIdCardBase
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
    - type: Sprite
      sprite: _EM/Objects/Misc/id_cards.rsi
      layers:
        - state: base_id_card
        - sprite: &icon-rsi _EM/Interface/Misc/job_icon.rsi
          offset: &icon-offset -0.15625, 0
          state: Base
    - type: Item
      size: Small
      heldPrefix: default
      storedRotation: -90
    - type: Access
    - type: IdCard
    - type: StationRecordKeyStorage
    - type: Tag
      tags:
        - DoorBumpOpener
        - EMWhitelistChameleon
        - EMWhitelistChameleonIdCard
        - EMIdCard
    - type: StealTarget
      stealGroup: IDCard

- type: entity
  parent: EMIdCardBase
  id: EMIdBadgeBase
  name: identification badge
  description: A card necessary to access various areas aboard the station.
  abstract: true
  categories: [ForkFiltered]
  components:
    - type: Sprite
      sprite: _EM/Objects/Misc/id_cards.rsi
      layers:
        - state: base_id_badge
        - sprite: *icon-rsi
          offset: &icon-badge-offset -0.1875, -0.09375
          state: Base
    - type: Clothing
      slots:
        - idcard
      sprite: _EM/Objects/Misc/id_cards.rsi
    - type: Tag
      tags:
        - EMIdBadge

