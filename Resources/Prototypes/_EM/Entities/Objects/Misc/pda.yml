- type: entity
  parent: [BaseItem, StorePresetUplink]
  id: EMBasePDA
  name: PDA
  description: Personal Data Assistant.
  categories: [ForkFiltered]
  components:
    - type: Appearance
      appearanceDataInit:
        enum.PdaVisuals.PdaType: !type:String pda
    - type: Sprite
      sprite: _EM/Objects/Misc/pda.rsi
      layers:
        - map: ["enum.PdaVisualLayers.Base"]
          state: "base-pda"
    - type: Icon
      sprite: _EM/Objects/Misc/pda.rsi
      state: base-pda
    - type: Pda
      paiSlot:
        priority: -2
        whitelist:
          components:
            - PAI
      penSlot:
        startingItem: Pen
        priority: -1
        whitelist:
          tags:
            - Write
      idSlot:
        name: access-id-card-component-default
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Machines/id_insert.ogg
        whitelist:
          tags:
            - EMIdCard
      id: EMIdCardEmpty
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        PDA-id: !type:ContainerSlot {}
        PDA-pen: !type:ContainerSlot {}
        PDA-pai: !type:ContainerSlot {}
        Cartridge-Slot: !type:ContainerSlot {}
        program-container: !type:Container
    - type: ItemSlots
    - type: Clothing
      quickEquip: false
      slots:
        - idcard
        - Belt
    - type: Ringer
    - type: RingerUplink
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: PDA
      prefix: device-address-prefix-console
      savableAddress: false
    - type: WirelessNetworkConnection
      range: 500
    - type: CartridgeLoader
      uiKey: enum.PdaUiKey.Key
      preinstalled:
        - NotekeeperCartridge
      cartridgeSlot:
        priority: -1
        name: device-pda-slot-component-slot-name-cartridge
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Machines/id_insert.ogg
        whitelist:
          components:
            - Cartridge
    - type: ActivatableUI
      key: enum.PdaUiKey.Key
      singleUser: true
    - type: UserInterface
      interfaces:
        enum.PdaUiKey.Key:
          type: PdaBoundUserInterface
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: Tag
      tags:
        - DoorBumpOpener
        - EMWhitelistChameleon
        - EMWhitelistChameleonPDA

