- type: entity
  parent: EMBaseItem
  id: EMBasePDA
  name: PDA
  description: Personal Data Assistant.
  categories:
  - ForkFiltered
  components:
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType: !type:String pda
  - type: Sprite
    sprite: _EM/Objects/Misc/pda.rsi
    layers:
    - map:
      - "enum.PdaVisualLayers.Base"
      state: "base-pda"
  - type: Icon
    sprite: _EM/Objects/Misc/pda.rsi
    state: base-pda
  - type: Pda
    paiSlot:
      priority: -2
      whitelist:
        components:
        - PAI
    idSlot:
      name: access-id-card-component-default
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        tags:
        - EMIdCard
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      PDA-id:
        !type:ContainerSlot {}
      PDA-pen:
        !type:ContainerSlot {}
      PDA-pai:
        !type:ContainerSlot {}
      Cartridge-Slot:
        !type:ContainerSlot {}
      preinstalled-program-container: !type:Container
      removable-program-container: !type:Container
  - type: ItemSlots
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
    - Belt
  - type: Ringer
  - type: RingerUplink
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: PDA
    prefix: device-address-prefix-console
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 500
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    cartridgeSlot:
      priority: -1
      name: device-pda-slot-component-slot-name-cartridge
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - Cartridge
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
  - type: ActivatableUI
    key: enum.PdaUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: RemoteStore
  - type: Tag
    tags:
    - DoorBumpOpener
    - EMWhitelistChameleon
    - EMWhitelistChameleonPDA

- type: entity
  parent: EMBasePDA
